name: Promote

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# npm trusted publishing is bound to the workflow filename `release.yml`.
# This workflow can dry-run a promote. To actually update dist-tags, re-run the
# Release `packages` job or use Actions → Release → Run workflow.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description:
          'Run as dry run (will not actually update dist tags)'
        default: true

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/promote
        with:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
